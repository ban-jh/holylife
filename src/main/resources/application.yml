# HolyLife Application Configuration

server:
  port: 8080

spring:
  application:
    name: holylife

  # H2 Console (개발용)
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # DataSource (H2 인메모리 - 개발용)
  datasource:
    url: jdbc:h2:mem:holylife
    driver-class-name: org.h2.Driver
    username: sa
    password:

# Logging
logging:
  level:
    org.shaloman.pj: DEBUG
    org.hibernate.SQL: DEBUG