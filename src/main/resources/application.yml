# HolyLife 공통 설정 (모든 프로파일에 적용)
# 프로파일별 설정: application-local.yml, application-dev.yml, application-prod.yml
# DB 접속 정보는 각 프로파일에서 관리

server:
  port: 38081

spring:
  application:
    name: holylife

  # BatchConfig에서 정의한 JDBC JobRepository가 Boot 자동설정 빈을 덮어쓸 수 있도록 허용
  main:
    allow-bean-definition-overriding: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  # Spring Batch
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: org.shaloman.pj
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    default-fetch-size: 100
    default-statement-timeout: 30

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    groups-order: DESC
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  packages-to-scan: org.shaloman.pj

# Password Encryption (BCrypt)
holylife:
  security:
    password:
      bcrypt-strength: 10
  upload:
    path: /opt/holylife/uploads
    url-prefix: /uploads
  qt:
    crawl-url: https://www.duranno.com/qt/view/bible.asp
    sum-crawl-url: https://sum.su.or.kr:8888/bible/today

# JWT
jwt:
  secret: ${JWT_SECRET:holylife-secret-key-for-jwt-token-generation-2026}
  expiration: 86400000  # 24 hours in ms

# Logging
logging:
  level:
    org.shaloman.pj: DEBUG
    org.mybatis: DEBUG