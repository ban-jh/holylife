# HolyLife Application Configuration

server:
  port: 8080

spring:
  application:
    name: holylife

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  # Spring Batch
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  # MariaDB DataSource
  datasource:
    url: jdbc:mariadb://localhost:3306/holylife
    driver-class-name: org.mariadb.jdbc.Driver
    username: shaloman
    password: 123321
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: org.shaloman.pj.domain
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    default-fetch-size: 100
    default-statement-timeout: 30

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    groups-order: DESC
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  packages-to-scan: org.shaloman.pj.controller

# Password Encryption (BCrypt)
holylife:
  security:
    password:
      bcrypt-strength: 10
  upload:
    path: /opt/holylife/uploads
    url-prefix: /uploads
  qt:
    crawl-url: https://www.duranno.com/qt/view/bible.asp
    sum-crawl-url: https://sum.su.or.kr:8888/bible/today

# Logging
logging:
  level:
    org.shaloman.pj: DEBUG
    org.mybatis: DEBUG