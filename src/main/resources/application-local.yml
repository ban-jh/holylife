# HolyLife Local Configuration
# 로컬 개발환경 — 개발자 PC에서 직접 실행 시 사용
# 실행: --spring.profiles.active=local

server:
  port: 8080

spring:
  # H2 또는 로컬 MariaDB — 환경에 맞게 조정
  datasource:
    url: jdbc:mariadb://localhost:3306/holylife
    driver-class-name: org.mariadb.jdbc.Driver
    username: shaloman
    password: 123321

# Swagger — 로컬에서는 항상 활성화
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true

# JWT — 로컬은 고정 키 사용
jwt:
  secret: holylife-local-dev-secret-key-for-jwt-testing-only
  expiration: 86400000

# BCrypt — 로컬은 빠른 속도를 위해 낮은 strength
holylife:
  security:
    password:
      bcrypt-strength: 8
  upload:
    path: ./uploads
    url-prefix: /uploads

# Logging — 로컬은 상세 로그
logging:
  level:
    org.shaloman.pj: DEBUG
    org.mybatis: DEBUG
    org.springframework.security: DEBUG