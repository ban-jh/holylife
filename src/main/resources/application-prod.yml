# HolyLife Production Configuration (source — deployed copy in /opt/holylife/config/)

spring:
  datasource:
    password: ${DB_PASSWORD:123321}
  # 취약점 #10: 파일 업로드 크기 제한
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# 취약점 #5: 프로덕션에서 Swagger 비활성화
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# 취약점 #1: JWT 시크릿 환경변수화
# 취약점 #13: 기본값 제거 — 환경변수만 사용
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

holylife:
  upload:
    path: /opt/holylife/uploads
    url-prefix: /uploads