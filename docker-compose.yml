# holylife Docker Compose
# 로컬 테스트: 원격 MariaDB + Spring Boot Backend + Nginx Frontend
#
# 사용법:
#   docker-compose up -d          # 전체 서비스 시작
#   docker-compose down           # 전체 서비스 중지
#   docker-compose logs -f        # 로그 실시간 확인
#   docker-compose restart backend # 백엔드만 재시작
#
# Oracle Cloud ARM(Ampere A1)에서 테스트됨

services:
  # ── Spring Boot 백엔드 ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: holylife-backend
    restart: unless-stopped
    ports:
      - "38081:38081"
    networks:
      - holylife-net
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mariadb://${DB_HOST:?Set DB_HOST in .env}:${DB_PORT:-3306}/${DB_NAME:?Set DB_NAME in .env}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

networks:
  holylife-net:
    driver: bridge
