# HolyLife: public 38080 -> Nginx 8080 -> Spring Boot 8081
# Run from /opt/holylife/backend with:
# docker compose --env-file /opt/holylife/config/.env up -d --build

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: holylife-backend
    restart: unless-stopped
    expose:
      - "8081"
    volumes:
      - ../uploads:/opt/holylife/uploads
      - ../logs:/opt/holylife/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - holylife-net
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:mariadb://${DB_HOST:?Set DB_HOST in .env}:${DB_PORT:-3306}/${DB_NAME:?Set DB_NAME in .env}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: holylife-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "38080:8080"
    networks:
      - holylife-net

networks:
  holylife-net:
    driver: bridge
