<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>독서 노트 작성</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #faf7f2; --cream-dark: #f2ece0; --warm-white: #fffcf8;
    --sand: #e8ddd0; --sand-dark: #d4c5b0; --brown-light: #c8b49a;
    --brown: #8c6f56; --brown-dark: #5e4a38;
    --accent: #c97d4e; --accent-light: #f0d4ba; --accent-hover: #b06b3c;
    --text-primary: #2d2118; --text-secondary: #7a6655; --text-muted: #a89585;
    --sidebar-width: 240px; --header-height: 64px;
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 18px;
    --shadow-sm: 0 1px 4px rgba(100,70,40,0.07);
    --shadow-md: 0 4px 16px rgba(100,70,40,0.10);
    --shadow-lg: 0 8px 32px rgba(100,70,40,0.13);
    --transition: 0.22s cubic-bezier(.4,0,.2,1);
  }

  html, body {
    height: 100%;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    background: var(--cream); color: var(--text-primary);
    font-size: 14px; line-height: 1.6;
  }

  .layout { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar { width: var(--sidebar-width); background: var(--brown-dark); display: flex; flex-direction: column; flex-shrink: 0; position: relative; z-index: 100; transition: transform var(--transition), width var(--transition); overflow: hidden; }
  .sidebar-logo { height: var(--header-height); display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .sidebar-logo-icon { width: 34px; height: 34px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sidebar-logo-icon svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 1.8; }
  .sidebar-logo-text { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -0.3px; line-height: 1.2; }
  .sidebar-logo-sub { font-size: 10px; color: rgba(255,255,255,0.4); font-weight: 400; letter-spacing: 0.3px; }
  .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 10px 20px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }
  .sidebar-nav::-webkit-scrollbar { width: 4px; }
  .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
  .nav-section-label { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.3); letter-spacing: 1px; text-transform: uppercase; padding: 16px 10px 6px; }
  .nav-item { position: relative; }
  .nav-link { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius-sm); color: rgba(255,255,255,0.65); cursor: pointer; transition: background var(--transition), color var(--transition); user-select: none; text-decoration: none; }
  .nav-link:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.92); }
  .nav-link.active { background: var(--accent); color: #fff; font-weight: 600; }
  .nav-link.parent-active { background: rgba(201,125,78,0.18); color: rgba(255,255,255,0.92); }
  .nav-link svg { width: 16px; height: 16px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .nav-link-label { flex: 1; font-size: 13.5px; font-weight: 500; }
  .nav-chevron { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; transition: transform var(--transition); flex-shrink: 0; }
  .nav-chevron.open { transform: rotate(180deg); }
  .nav-sub { overflow: hidden; max-height: 0; transition: max-height 0.32s cubic-bezier(.4,0,.2,1), opacity 0.22s; opacity: 0; }
  .nav-sub.open { max-height: 300px; opacity: 1; }
  .nav-sub-item { display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 40px; border-radius: var(--radius-sm); color: rgba(255,255,255,0.5); cursor: pointer; font-size: 13px; font-weight: 400; transition: background var(--transition), color var(--transition); user-select: none; }
  .nav-sub-item::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.25); flex-shrink: 0; transition: background var(--transition); }
  .nav-sub-item:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.85); }
  .nav-sub-item:hover::before { background: var(--accent); }
  .nav-sub-item.active { color: var(--accent-light); font-weight: 600; }
  .nav-sub-item.active::before { background: var(--accent); }
  .sidebar-footer { padding: 14px 10px; border-top: 1px solid rgba(255,255,255,0.06); }
  .sidebar-user { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; transition: background var(--transition); }
  .sidebar-user:hover { background: rgba(255,255,255,0.07); }
  .sidebar-user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .sidebar-user-info { flex: 1; min-width: 0; }
  .sidebar-user-name { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-user-role { font-size: 11px; color: rgba(255,255,255,0.38); }

  /* ── Main ── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--cream); }
  .header { height: var(--header-height); background: var(--warm-white); border-bottom: 1px solid var(--sand); display: flex; align-items: center; padding: 0 28px; gap: 14px; flex-shrink: 0; box-shadow: var(--shadow-sm); position: relative; z-index: 10; }
  .mobile-menu-btn { display: none; width: 36px; height: 36px; border: none; background: transparent; border-radius: var(--radius-sm); cursor: pointer; align-items: center; justify-content: center; color: var(--text-secondary); transition: background var(--transition); }
  .mobile-menu-btn:hover { background: var(--cream-dark); }
  .mobile-menu-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
  .breadcrumb { display: flex; align-items: center; gap: 6px; flex: 1; }
  .breadcrumb-item { font-size: 13px; color: var(--text-muted); font-weight: 400; }
  .breadcrumb-item.current { color: var(--text-primary); font-weight: 600; }
  .breadcrumb-sep { color: var(--sand-dark); font-size: 12px; }
  .header-actions { display: flex; align-items: center; gap: 6px; }
  .header-search { display: flex; align-items: center; gap: 8px; background: var(--cream); border: 1.5px solid var(--sand); border-radius: 22px; padding: 7px 14px; transition: border-color var(--transition), box-shadow var(--transition); }
  .header-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(201,125,78,0.12); }
  .header-search svg { width: 15px; height: 15px; stroke: var(--text-muted); fill: none; stroke-width: 2; flex-shrink: 0; }
  .header-search input { border: none; background: transparent; outline: none; font-size: 13px; color: var(--text-primary); width: 160px; font-family: inherit; }
  .header-search input::placeholder { color: var(--text-muted); }
  .icon-btn { width: 36px; height: 36px; border: none; background: transparent; border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); transition: background var(--transition), color var(--transition); position: relative; }
  .icon-btn:hover { background: var(--cream-dark); color: var(--text-primary); }
  .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .badge { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: var(--accent); border-radius: 50%; border: 1.5px solid var(--warm-white); }
  .header-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; cursor: pointer; transition: opacity var(--transition); margin-left: 4px; border: 2px solid var(--accent-light); }
  .header-avatar:hover { opacity: 0.85; }

  .content { flex: 1; overflow-y: auto; padding: 32px 36px; scrollbar-width: thin; scrollbar-color: var(--sand) transparent; }
  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-thumb { background: var(--sand); border-radius: 4px; }
  .page-header { margin-bottom: 24px; }
  .page-title { font-size: 22px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.5px; line-height: 1.3; }
  .page-desc { font-size: 13.5px; color: var(--text-muted); margin-top: 4px; }

  /* ── Middle Split ── */
  .middle { display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: stretch; margin-bottom: 20px; }
  .middle-card { background: var(--warm-white); border: 1px solid var(--sand); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column; }
  .middle-header { padding: 20px 24px 0; }
  .middle-title { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 12px; }

  /* ── Book Info Form ── */
  .book-info-body { padding: 24px; display: flex; flex-direction: column; gap: 20px; flex: 1; }

  .book-cover-upload {
    display: flex; gap: 20px; align-items: flex-start;
  }

  .book-cover-preview {
    width: 120px; height: 168px; border-radius: var(--radius-sm);
    border: 1px solid var(--sand); background: linear-gradient(135deg, var(--sand), var(--sand-dark));
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; box-shadow: var(--shadow-sm);
  }
  .book-cover-preview svg { width: 32px; height: 32px; stroke: var(--brown); fill: none; stroke-width: 1.5; }

  .book-cover-actions { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }

  /* ── Form Controls ── */
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
  .form-input, input, select, textarea {
    width: 100%; padding: 10px 14px; border: 1.5px solid var(--sand);
    border-radius: var(--radius-sm); background: var(--cream);
    font-size: 13.5px; color: var(--text-primary); font-family: inherit;
    outline: none; transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    line-height: 1.5;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); background: var(--warm-white); box-shadow: 0 0 0 3px rgba(201,125,78,0.10); }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  /* ── Content Editor (Right) ── */
  .content-editor { padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
  .editor-section { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .editor-section label { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
  .editor-section textarea { width: 100%; resize: vertical; line-height: 1.8; }
  .editor-section.summary textarea { height: 200px; }
  .editor-section.impression textarea { height: 200px; }

  /* ── Buttons ── */
  .bottom-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 20px; border-radius: var(--radius-sm); font-size: 13.5px; font-weight: 600; cursor: pointer; border: 1.5px solid transparent; transition: all var(--transition); }
  .btn-cancel { background: var(--warm-white); color: var(--text-secondary); border-color: var(--sand); }
  .btn-cancel:hover { background: var(--cream-dark); color: var(--text-primary); }
  .btn-save { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 2px 8px rgba(201,125,78,0.25); }
  .btn-save:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-upload { background: var(--cream); color: var(--text-secondary); border-color: var(--sand); padding: 8px 14px; font-size: 12.5px; }
  .btn-upload:hover { background: var(--cream-dark); color: var(--text-primary); }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(45,33,24,0.45); z-index: 90; backdrop-filter: blur(2px); }
  @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .content > * { animation: fadeSlideIn 0.35s cubic-bezier(.4,0,.2,1) both; }

  @media (max-width: 900px) { .middle { grid-template-columns: 1fr; } .info-grid { grid-template-columns: 1fr; } }
  @media (max-width: 680px) { .sidebar { position: fixed; top: 0; left: 0; height: 100%; transform: translateX(-100%); z-index: 200; } .sidebar.open { transform: translateX(0); } .overlay.active { display: block; } .mobile-menu-btn { display: flex; } .content { padding: 20px 18px; } .header { padding: 0 16px; } .header-search { display: none; } .book-cover-upload { flex-direction: column; align-items: center; } }
</style>
</head>
<body>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L3 7v10l9 5 9-5V7L12 2z"/><path d="M12 22V12"/><path d="M3 7l9 5 9-5"/></svg>
      </div>
      <div>
        <div class="sidebar-logo-text">말씀 관리자</div>
        <div class="sidebar-logo-sub">Word Admin Console</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">메인 메뉴</div>

      <div class="nav-item">
        <div class="nav-link" onclick="setActive(this)">
          <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          <span class="nav-link-label">P.B.S (성경공부)</span>
        </div>
      </div>

      <div class="nav-item">
        <div class="nav-link" onclick="setActive(this)">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <span class="nav-link-label">Q.T</span>
        </div>
      </div>

      <div class="nav-item">
        <div class="nav-link" onclick="setActive(this)">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="nav-link-label">설교</span>
        </div>
      </div>

      <div class="nav-item">
        <div class="nav-link active" onclick="setActive(this)">
          <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span class="nav-link-label">독서</span>
        </div>
      </div>

      <div class="nav-section-label">관리</div>

      <div class="nav-item">
        <div class="nav-link" id="system-parent" onclick="toggleSystem()">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2"/></svg>
          <span class="nav-link-label">시스템</span>
          <svg class="nav-chevron" id="system-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="nav-sub" id="system-sub">
          <div class="nav-sub-item" onclick="setSubActive(this)">사용자</div>
          <div class="nav-sub-item" onclick="setSubActive(this)">메뉴</div>
          <div class="nav-sub-item" onclick="setSubActive(this)">권한</div>
          <div class="nav-sub-item" onclick="setSubActive(this)">공통코드</div>
        </div>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar">박</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">박성민 관리자</div>
          <div class="sidebar-user-role">Super Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- Main Area -->
  <div class="main">
    <header class="header">
      <button class="mobile-menu-btn" onclick="openSidebar()">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <div class="breadcrumb">
        <span class="breadcrumb-item">독서</span>
        <span class="breadcrumb-sep">/</span>
        <span class="breadcrumb-item current">독서 노트 작성</span>
      </div>

      <div class="header-actions">
        <div class="header-search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="검색어를 입력하세요">
        </div>
        <button class="icon-btn" title="알림">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="badge"></span>
        </button>
        <div class="header-avatar">박</div>
      </div>
    </header>

    <!-- Main Content -->
    <div class="content">

      <div class="page-header">
        <div class="page-title">독서 노트 작성</div>
        <div class="page-desc">읽은 책의 정보와 요약, 느낀점을 기록합니다.</div>
      </div>

      <!-- 중앙 영역 (책 정보 / 요약·느낀점) -->
      <div class="middle">
        <!-- 왼쪽: 책 정보 -->
        <section class="middle-card">
          <div class="middle-header">
            <div class="middle-title">책 정보</div>
          </div>
          <div class="book-info-body">

            <!-- 책 표지 -->
            <div class="book-cover-upload">
              <div class="book-cover-preview" id="coverPreview">
                <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              </div>
              <div class="book-cover-actions">
                <button class="btn btn-upload" type="button" onclick="document.getElementById('coverFile').click()">
                  <svg style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                  이미지 업로드
                </button>
                <button class="btn btn-upload" type="button" onclick="removeCover()">
                  <svg style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                  이미지 삭제
                </button>
                <input type="file" id="coverFile" accept="image/*" style="display:none" onchange="previewCover(this)">
              </div>
            </div>

            <!-- 책 정보 입력 -->
            <div class="form-group">
              <label>책제목</label>
              <input type="text" id="bookTitle" placeholder="책 제목을 입력하세요" value="하나님의 임재 연습">
            </div>

            <div class="form-group">
              <label>날짜</label>
              <input type="date" id="readDate" value="2026-09-10">
            </div>

            <div class="form-group">
              <label>목차</label>
              <textarea id="tableOfContents" placeholder="읽은 목차를 입력하세요 (여러 줄 입력 가능)" rows="4" style="resize: vertical; line-height: 1.8;">전체</textarea>
            </div>

            <div class="info-grid">
              <div class="form-group">
                <label>저자</label>
                <input type="text" id="author" placeholder="저자를 입력하세요" value="로렌스 형제">
              </div>

              <div class="form-group">
                <label>옮긴이</label>
                <input type="text" id="translator" placeholder="옮긴이를 입력하세요" value="홍명광">
              </div>
            </div>

          </div>
        </section>

        <!-- 오른쪽: 요약 & 느낀점 -->
        <section class="middle-card">
          <div class="middle-header">
            <div class="middle-title">독서 내용</div>
          </div>
          <div class="content-editor">

            <div class="editor-section summary">
              <label>요약</label>
              <textarea id="summary" placeholder="책의 내용을 요약하여 입력하세요.">로렌스 형제는 17세기 프랑스 수도사로, 일상적인 삶 속에서 하나님의 임재를 연습하는 삶을 살았습니다.

이 책은 그가 친구들에게 보낸 편지들과 영적 지도를 모은 것으로, 하나님을 매 순간 의식하며 살아가는 실천적 신앙의 비결을 담고 있습니다.

핵심 메시지는 "큰일이든 작은 일이든 모든 일을 하나님의 영광을 위해 하라"는 것입니다. 기도 시간뿐 아니라 부엌에서 설거지를 할 때도 하나님과 교제할 수 있다고 말합니다.

그는 하나님의 임재를 의식하는 것이 특별한 은혜가 아니라 모든 그리스도인이 일상에서 누릴 수 있는 축복이라고 강조합니다.</textarea>
            </div>

            <div class="editor-section impression">
              <label>느낀점</label>
              <textarea id="impression" placeholder="책을 읽고 느낀 점을 입력하세요.">이 책을 읽으며 가장 크게 다가온 것은 "일상이 곧 영성"이라는 사실이었습니다.

나는 늘 특별한 시간을 내어 기도해야만 하나님을 만날 수 있다고 생각했습니다. 그러나 로렌스 형제는 부엌에서 일하는 동안에도 하나님과 대화할 수 있다고 말합니다.

이 말씀은 제 삶의 관점을 바꾸어 놓았습니다. 출퇴근 길, 집안일, 직장에서의 업무 — 모든 순간이 하나님과 동행할 수 있는 시간입니다.

앞으로는 일상의 모든 순간을 의식하며 하나님의 임재를 구하는 연습을 해보려 합니다. 거창한 결심보다 매 순간의 작은 의식이 삶을 변화시킨다는 것을 깨달았습니다.

특히 "하나님을 위해 하는 일에는 크고 작음이 없다"는 말씀이 오래도록 마음에 남습니다.</textarea>
            </div>

          </div>
        </section>
      </div>

      <!-- 하단 버튼 -->
      <div class="bottom-buttons">
        <button class="btn btn-cancel" onclick="cancelContent()">취소</button>
        <button class="btn btn-save" onclick="saveContent()">저장하기</button>
      </div>

    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" style="position: fixed; bottom: 28px; right: 28px; background: var(--brown-dark); color: #fff; padding: 12px 20px; border-radius: var(--radius-md); font-size: 13.5px; font-weight: 500; box-shadow: var(--shadow-lg); transform: translateY(80px); opacity: 0; transition: transform 0.3s cubic-bezier(.4,0,.2,1), opacity 0.3s; pointer-events: none; z-index: 9999; display: flex; align-items: center; gap: 10px;">
  <svg style="width:16px;height:16px;stroke:#a8d8bc;fill:none;stroke-width:2.5;flex-shrink:0" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toast-msg"></span>
</div>

<script>
  function setActive(el) { document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active')); el.classList.add('active'); }
  var systemOpen = false;
  function toggleSystem() { systemOpen = !systemOpen; var sub = document.getElementById('system-sub'); var chevron = document.getElementById('system-chevron'); var parent = document.getElementById('system-parent'); if (systemOpen) { sub.classList.add('open'); chevron.classList.add('open'); parent.classList.add('parent-active'); } else { sub.classList.remove('open'); chevron.classList.remove('open'); parent.classList.remove('parent-active'); } }
  function setSubActive(el) { document.querySelectorAll('.nav-sub-item').forEach(i => i.classList.remove('active')); el.classList.add('active'); }
  function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('active'); }
  function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('active'); }

  // Book Cover Preview
  function previewCover(input) {
    if (input.files && input.files[0]) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var preview = document.getElementById('coverPreview');
        preview.style.background = 'url(' + e.target.result + ') center/cover';
        preview.innerHTML = '';
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  function removeCover() {
    var preview = document.getElementById('coverPreview');
    preview.style.background = 'linear-gradient(135deg, var(--sand), var(--sand-dark))';
    preview.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>';
    document.getElementById('coverFile').value = '';
  }

  // Toast
  var toastTimer;
  function showToast(msg) { clearTimeout(toastTimer); var toast = document.getElementById('toast'); document.getElementById('toast-msg').textContent = msg; toast.style.transform = 'translateY(0)'; toast.style.opacity = '1'; toastTimer = setTimeout(function() { toast.style.transform = 'translateY(80px)'; toast.style.opacity = '0'; }, 2800); }
  function saveContent() { showToast('독서 노트가 성공적으로 저장되었습니다.'); }
  function cancelContent() { if (confirm('작성 중인 내용이 초기화됩니다. 계속하시겠습니까?')) { location.reload(); } }
</script>
</body>
</html>
