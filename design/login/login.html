<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faith Pathway - 로그인</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --cream: #faf7f2;
      --cream-dark: #f2ece0;
      --warm-white: #fffcf8;
      --sand: #e8ddd0;
      --sand-dark: #d4c5b0;
      --brown-light: #c8b49a;
      --brown: #8c6f56;
      --brown-dark: #5e4a38;
      --accent: #c97d4e;
      --accent-light: #f0d4ba;
      --accent-hover: #b06b3c;
      --text-primary: #2d2118;
      --text-secondary: #7a6655;
      --text-muted: #a89585;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --shadow-sm: 0 1px 4px rgba(100,70,40,0.07);
      --shadow-md: 0 4px 16px rgba(100,70,40,0.10);
      --shadow-lg: 0 8px 32px rgba(100,70,40,0.13);
      --transition: 0.22s cubic-bezier(.4,0,.2,1);
    }

    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--cream);
      background-image: radial-gradient(var(--sand-dark) 0.75px, transparent 0.75px),
                        radial-gradient(var(--sand-dark) 0.75px, var(--cream) 0.75px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      padding: 20px;
      color: var(--text-primary);
    }

    /* Container Card */
    .login-container {
      background: var(--warm-white);
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--sand);
      box-shadow: var(--shadow-lg);
    }

    /* Header & Logo Section */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      color: var(--accent);
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--sand);
      border-radius: var(--radius-sm);
      background: var(--cream);
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }

    .form-input:focus {
      border-color: var(--accent);
      background: var(--warm-white);
      box-shadow: 0 0 0 3px rgba(201,125,78,0.10);
    }

    /* Primary Button */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color var(--transition);
      box-shadow: 0 2px 8px rgba(201,125,78,0.25);
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    /* Footer Section */
    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .signup-link {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      margin-left: 4px;
    }

    .signup-link:hover {
      text-decoration: underline;
    }

    /* Layer Popup / Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(45,33,24,0.45);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* Layer Popup Box */
    .modal-card {
      background: var(--warm-white);
      width: 100%;
      max-width: 360px;
      padding: 28px 24px 24px 24px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--sand);
      text-align: center;
      box-shadow: var(--shadow-lg);
      transform: scale(0.92);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    /* Warning Icon Area */
    .modal-icon-wrapper {
      width: 56px;
      height: 56px;
      background-color: #fef2f2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
    }

    .warning-icon {
      width: 28px;
      height: 28px;
      color: #ef4444;
    }

    /* Modal Text */
    .modal-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .modal-message {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    /* Modal Close Button */
    .btn-modal-close {
      width: 100%;
      padding: 12px;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color var(--transition);
    }

    .btn-modal-close:hover {
      background-color: var(--accent-hover);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <!-- 로고 및 헤더 -->
    <div class="header">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L3 7v10l9 5 9-5V7L12 2z"/>
        <path d="M12 22V12"/>
        <path d="M3 7l9 5 9-5"/>
      </svg>
      <h1 class="title">FAITH PATHWAY</h1>
      <p class="subtitle">말씀과 독서로 자라나는 신앙의 길</p>
    </div>

    <!-- 로그인 폼 -->
    <form id="loginForm">
      <div class="form-group">
        <label for="email" class="form-label">이메일 주소</label>
        <input type="email" id="email" class="form-input" placeholder="example@church.com" required>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">비밀번호</label>
        <input type="password" id="password" class="form-input" placeholder="비밀번호를 입력하세요" required>
      </div>

      <button type="submit" class="btn-submit">로그인</button>
    </form>

    <!-- 하단 링크 -->
    <div class="footer">
      계정이 없으신가요? <a href="#" class="signup-link">회원가입</a>
    </div>
  </div>

  <!-- 레이어 팝업 (모달) -->
  <div class="modal-overlay" id="errorModal">
    <div class="modal-card">
      <div class="modal-icon-wrapper">
        <!-- 경고 아이콘 (SVG) -->
        <svg class="warning-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <h3 class="modal-title">로그인 실패</h3>
      <p class="modal-message">아이디/패스워드 가 맞지 않습니다.<br>다시 확인해주세요.</p>
      <button type="button" class="btn-modal-close" id="btnCloseModal">확인</button>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const errorModal = document.getElementById('errorModal');
    const btnCloseModal = document.getElementById('btnCloseModal');

    // 로그인 폼 제출 시 레이어 팝업 띄우기
    loginForm.addEventListener('submit', function(event) {
      event.preventDefault();
      errorModal.classList.add('active');
    });

    // 닫기(확인) 버튼 클릭 시 팝업 닫기
    btnCloseModal.addEventListener('click', function() {
      errorModal.classList.remove('active');
    });

    // 바깥 배경(오버레이) 클릭 시에도 팝업 닫기
    errorModal.addEventListener('click', function(event) {
      if (event.target === errorModal) {
        errorModal.classList.remove('active');
      }
    });
  </script>

</body>
</html>
